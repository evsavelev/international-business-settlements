name: QA

on:
  push:
    branches:
      - main
      - audit/seo-qa
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm run install:ci

      - name: Lint
        run: npm run lint

      - name: Build and tests
        run: npm test
